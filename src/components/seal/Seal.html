<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1b120a" />
  <title>Seal | YRELIS CoffeeBar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./Seal.css" />
</head>
<body>
  <!-- Sello vacío (decorativo) -->
  <span class="seal" style="width: 46px; height: 46px;" aria-hidden="true">
    <svg viewBox="0 0 48 48" width="100%" height="100%">
      <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 4" />
      <circle cx="24" cy="24" r="15.5" fill="none" stroke="currentColor" stroke-width="1.2" />
    </svg>
  </span>

  <!-- Sello relleno (firma visual) -->
  <span class="seal seal--filled" style="width: 46px; height: 46px;" aria-hidden="true">
    <svg viewBox="0 0 48 48" width="100%" height="100%">
      <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 4" />
      <circle cx="24" cy="24" r="15.5" fill="none" stroke="currentColor" stroke-width="1.2" />
    </svg>
  </span>

  <!-- Sello con etiqueta -->
  <span class="seal" style="width: 46px; height: 46px;" role="img" aria-label="Sello YRELIS">
    <svg viewBox="0 0 48 48" width="100%" height="100%">
      <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 4" />
      <circle cx="24" cy="24" r="15.5" fill="none" stroke="currentColor" stroke-width="1.2" />
    </svg>
    <span class="seal__label">Y</span>
  </span>
</body>
</html>
