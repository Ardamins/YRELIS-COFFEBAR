<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1b120a" />
  <title>StampCard | YRELIS CoffeeBar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"

  />
  <link rel="stylesheet" href="./StampCard.css" />
</head>
<body>
  <div class="stamp-card card">
    <div class="stamp-card__head">
      <span class="stamp-card__seal" aria-hidden="true"></span>
      <div>
        <h3>Tarjeta cliente frecuente</h3>
        <p>Consume café 7 días y te regalamos uno.</p>
      </div>
    </div>

    <div class="stamp-card__grid">
      <div class="stamp-card__stamp is-filled"></div>
      <div class="stamp-card__stamp is-filled"></div>
      <div class="stamp-card__stamp is-filled"></div>
      <div class="stamp-card__stamp">4</div>
      <div class="stamp-card__stamp">5</div>
      <div class="stamp-card__stamp">6</div>
      <div class="stamp-card__stamp">7</div>
    </div>
  </div>
</body>
</html>
