<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1b120a" />
  <title>Navbar | YRELIS CoffeeBar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./Navbar.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar__bar container">
      <a href="/" class="navbar__brand">
        <img src="./logo.jpg" alt="Logo YRELIS CoffeeBar" class="navbar__logo" />
        <span class="navbar__brand-text">
          <strong>YRELIS</strong>
          <em>CoffeeBar</em>
        </span>
      </a>

      <nav class="navbar__links navbar__links--desktop" aria-label="Navegación principal">
        <a href="/" class="navbar__link is-active">Inicio</a>
        <a href="/menu" class="navbar__link">Menú</a>
        <a href="/promociones" class="navbar__link">Promociones</a>
        <a href="/nosotros" class="navbar__link">Nosotros</a>
        <a href="/contacto" class="navbar__link">Contacto</a>
      </nav>

      <button
        class="navbar__toggle"
        aria-label="Abrir menú"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="navbar__links navbar__links--mobile" aria-label="Navegación móvil">
      <a href="/" class="navbar__link is-active">Inicio</a>
      <a href="/menu" class="navbar__link">Menú</a>
      <a href="/promociones" class="navbar__link">Promociones</a>
      <a href="/nosotros" class="navbar__link">Nosotros</a>
      <a href="/contacto" class="navbar__link">Contacto</a>
    </nav>
  </header>
</body>
</html>
