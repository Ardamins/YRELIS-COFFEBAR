<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Menú de YRELIS CoffeeBar — café de especialidad, cocina, jugos y coctelería en Gamarra, La Victoria, Lima."
  />
  <meta name="theme-color" content="#1b120a" />
  <title>Menú | YRELIS CoffeeBar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./Menu.css" />
</head>
<body>
  <main class="page menu-page">
    <section
      class="page-hero"
      style="--bg-image: url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1600&q=80');"
      aria-label="Menú YRELIS CoffeeBar"
    >
      <span class="page-hero__eyebrow">Nuestro menú</span>
      <h1>Todo lo que tenemos para ti</h1>
      <p>Café, cocina, jugos y coctelería — explora por categoría o busca tu antojo.</p>
    </section>

    <section class="section menu-controls-section">
      <div class="container">
        <div class="menu-controls">
          <!-- Buscador -->
          <div class="menu-search">
            <input
              type="search"
              placeholder="Buscar en el menú… ej. pisco, latte, lomo saltado"
              aria-label="Buscar producto"
            />
          </div>

          <!-- Fila: selector + actualizar -->
          <div class="menu-toolbar">
            <div class="menu-select">
              <select aria-label="Seleccionar categoría">
                <option value="todos">Seleccionar categoría</option>
                <option value="almuerzo">Almuerzo confortable</option>
                <option value="piqueo">Piqueo</option>
                <option value="desayunos">Desayunos</option>
                <option value="jugos">Jugos</option>
                <option value="antojitos">Antojitos</option>
                <option value="dulces">Dulces</option>
                <option value="infusiones">Infusiones calientes</option>
                <option value="cafes">Cafés</option>
                <option value="frappes">Frappés</option>
                <option value="refrescante">Refrescante</option>
                <option value="ice-coffee">Ice Coffee</option>
                <option value="cerveza">Cerveza y gaseosas</option>
                <option value="bebidas-hot">Bebidas hot</option>
                <option value="happy-hour">Happy Hour</option>
                <option value="shots">Shots</option>
                <option value="cocteleria-clasica">Coctelería clásica</option>
                <option value="cocteleria-cafe">Coctelería café</option>
                <option value="tendencia">Cócteles de tendencia</option>
              </select>
              <span class="menu-select__arrow" aria-hidden="true"></span>
            </div>

            <button type="button" class="menu-refresh" aria-label="Actualizar menú">
              <span class="menu-refresh__icon" aria-hidden="true"></span>
              Actualizar
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="menu-categories">
          <article class="menu-category card">
            <header class="menu-category__head">
              <span class="menu-category__icon" aria-hidden="true" data-icon="cafes"></span>
              <h2>Cafés</h2>
            </header>

            <ul class="menu-category__list">
              <li class="menu-item">
                <div class="menu-item__text">
                  <span class="menu-item__name">Espresso</span>
                  <span class="menu-item__desc">Intenso y aromático</span>
                </div>
                <span class="menu-item__price">S/ 3.00</span>
              </li>
              <li class="menu-item">
                <div class="menu-item__text">
                  <span class="menu-item__name">Latte</span>
                  <span class="menu-item__desc">Cremoso y suave</span>
                </div>
                <span class="menu-item__price">S/ 9.00</span>
              </li>
            </ul>
          </article>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
